<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Product Review Form</title>
    <meta name="description" content="Product Review Form for WDD 131 Dynamic Web Fundamentals">
    <meta name="author" content="Tatsa Zoho Noubosse Emmanuel">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">
            
           
            <div class="form-group">
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                   
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

           
            <fieldset class="form-group rating-group">
                <legend>Overall Rating</legend>
                <div class="star-rating">
                   
                    <div class="star-wrapper">
                        <label for="rating1" class="star-label">☆</label>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                    </div>
                    <div class="star-wrapper">
                        <label for="rating2" class="star-label">☆☆</label>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                    </div>
                    <div class="star-wrapper">
                        <label for="rating3" class="star-label">☆☆☆</label>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                    </div>
                    <div class="star-wrapper">
                        <label for="rating4" class="star-label">☆☆☆☆</label>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                    </div>
                    <div class="star-wrapper">
                        <label for="rating5" class="star-label">☆☆☆☆☆</label>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                    </div>
                </div>
            </fieldset>

            
            <div class="form-group">
                <label for="date">Date of Installation</label>
                <input type="date" id="date" name="date" required>
            </div>

          
            <fieldset class="form-group features-group">
                <legend>Which features did you find useful in the product?<br><span class="subtitle">(Check all that apply)</span></legend>
                
              
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="feature-durability" name="features" value="durability">
                    <label for="feature-durability">Durability</label>
                </div>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="feature-ease" name="features" value="ease">
                    <label for="feature-ease">Ease of Use</label>
                </div>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="feature-performance" name="features" value="performance">
                    <label for="feature-performance">Performance</label>
                </div>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="feature-design" name="features" value="design">
                    <label for="feature-design">Design</label>
                </div>
            </fieldset>

           
            <div class="form-group">
                <label for="review">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="review" name="review" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="username">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="username" name="username">
            </div>

            <div class="form-group">
                <input type="submit" value="Post Review" class="submit-btn">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> 🚀 Tatsa Zoho Noubosse Emmanuel 🚀 Cameroon</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
